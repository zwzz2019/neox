{
  "global_num_gpus": 16,
  "world_size": 16,
  "master_port": 12349,
  "master_addr": 32.12.194.212,
  "hostfile":"/workspace/fqt/neox/gpt-neox-main/212hostfile",
  "no_ssh_check": true,
  "no_ssh": true,
  "node_rank": 0,
#  "include": "node225@node229@node230:0,1,2,3,5,6,7",
#  "rank": 0,

#  "pipe_parallel_size": 1,
#  "model_parallel_size": 1,
  "make_vocab_size_divisible_by": 1,

  # misc. training settings
  "train_iters": 22200,
  "distributed_backend": "nccl",
  # batch / data settings
  "train_micro_batch_size_per_gpu": 8,
  "gradient_accumulation_steps": 16,

  # model settings
  "num_layers": 24,
  "hidden_size": 2048,
  "intermediate_size": 5460,
  "num_attention_heads": 32,
  "seq_length": 2048,
  "max_position_embeddings": 2048,
  "pos_emb": "rotary",
  "rotary_pct": 1,
  "no_weight_tying": true,
  "gpt_j_residual": false,
  "output_layer_parallelism": "column",
  "norm": "rmsnorm",
  "rms_norm_epsilon": 1.0e-5,

  "scaled_upper_triang_masked_softmax_fusion": true,
  "bias_gelu_fusion": false,
  "use_bias_in_norms": false,
  "use_bias_in_attn_linear": false,
  "mlp_type": "llama",
  "activation": "silu",

  # optimizer settings
  "optimizer": {
    "type": "cpu_adam",
    "params": {
      "lr": 2.0e-4,
      "betas": [0.9, 0.95]
    }
  },

# for all zero_optimization options, see https://www.deepspeed.ai/docs/config-json/#zero-optimizations-for-fp16-training
  "zero_optimization": {
        "stage": 2,
        "offload_optimizer": {
          "device": "cpu",
          "pin_memory": true
        },
        "allgather_partitions": True,
        "allgather_bucket_size": 500000000,
        "overlap_comm": True,
        "reduce_scatter": True,
        "reduce_bucket_size": 500000000,
        "contiguous_gradients": True,
  },
#  "zero_allow_untested_optimizer": true,

  "tokenizer_type": "HFTokenizer",
  "data_impl": "mmap",
#  "split": "90,5,5",
  # Suggested data paths when using GPT-NeoX locally
  # "data_path": "/workspace/fqt/neox/data/nexoTest_text_document",
  "num_workers": 64,
  "train_data_paths": ["/workspace/1bit/dataset/arxiv.jsonl_text_document",
                       "/workspace/1bit/dataset/wikipedia.jsonl_text_document",
                       "/workspace/1bit/dataset/stackoverflow.jsonl_text_document",
                       "/workspace/1bit/dataset/c4_seperate_0.jsonl_text_document",
                       "/workspace/1bit/dataset/c4_seperate_1.jsonl_text_document",
                       "/workspace/1bit/dataset/c4_seperate_2.jsonl_text_document",
                       "/workspace/1bit/dataset/c4_seperate_3.jsonl_text_document",
                       "/workspace/1bit/dataset/c4_seperate_4.jsonl_text_document",
                       "/workspace/1bit/dataset/c4_seperate_5.jsonl_text_document",
                       "/workspace/1bit/dataset/c4_seperate_6.jsonl_text_document",
                       "/workspace/1bit/dataset/c4_seperate_7.jsonl_text_document",
                       "/workspace/1bit/dataset/c4_seperate_8.jsonl_text_document" ],
  "test_data_paths": ["/workspace/1bit/dataset/c4_seperate_9.jsonl_text_document"],
  "valid_data_paths": ["/workspace/1bit/dataset/c4_seperate_9.jsonl_text_document"],
#  "train_data_paths": [ "/workspace/fqt/neox/data/nexoTest_text_document"],
#  "test_data_paths": ["/workspace/fqt/neox/data/nexoTest_text_document"],
#  "valid_data_paths": ["/workspace/fqt/neox/data/nexoTest_text_document"],
  "vocab_file": "/workspace/fqt/neox/data/vocab.txt",
  # "merge_file": "data/gpt2-merges.txt",
  "save": "/workspace/fqt/neox/checkpoints/Llama-16bit-1.3B",
  "tensorboard_dir": "/workspace/fqt/neox/checkpoints/tensorboard/Llama-16bit-1.3B",
  "log_dir": "/workspace/fqt/neox/checkpoints/logs/Llama-16bit-1.3B",
  "checkpoint_factor": 2000,
  "eval_interval": 2000,
  "eval_iters": 10,
  "save_iters": 2000,
  "log_interval": 1,
  "log_grad_norm": true,
  "do_train": true,
  "do_valid": true,
  "do_test": true,
#  "load": /workspace/fqt/neox/checkpoints/BitNet--ema-block32-1bit-300M,
#  "no_load_optim": true,
#  "iteration": 500,

  "lr_decay_style": "linear",
  "warmup": 0.01,
  "attention_config": [[["flash"], 24]],

  "checkpoint_activations": false,
  "checkpoint_num_layers": 1,
  "partition_activations": true,
  "synchronize_each_layer": true,

  "fp16": {
    "enabled": true,
    "loss_scale": 0,
    "loss_scale_window": 1000,
    "hysteresis": 2,
    "min_loss_scale": 1
  }
}
